integration.api.url=http://localhost:8080/api/orders

integration.api.token=${ORDER_API_TOKEN}

spring.application.name=enterprise-integration-service

logging.file.name=logs/integration-service.log

logging.structured.format.file=logstash

# SFTP connection
integration.sftp.host=localhost
integration.sftp.port=22
integration.sftp.username=${USER}

# Remote server directory
integration.sftp.remote-directory=sftp-lab/incoming
integration.sftp.outbound-directory=sftp-lab/processed

# SSH authentication and server verification
integration.sftp.private-key=${user.home}/.ssh/integration_sftp_lab
integration.sftp.known-hosts=${user.home}/.ssh/known_hosts

# MySQL database connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/integration_db}
spring.datasource.username=${DB_USERNAME:integration_app}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Expose diagnostic actuator endpoints 
management.endpoints.web.exposure.include=health,metrics

# Enable the health endpoint
management.endpoint.health.enabled=true

management.endpoint.health.show-details=never
management.endpoint.health.show-components=never 


# Enable Camel metrics
camel.metrics.enable-exchange-event-notifier=true
camel.metrics.enable-route-event-notifier=true
camel.metrics.enable-route-policy=true


logging.file.name=logs/integration-service.log

logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

logging.structured.format.file=logstash

